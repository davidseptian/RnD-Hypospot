<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hypospot R&D Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0d09;--panel:#1a1710;--line:#3a3220;--gold:#d4af37;--gold2:#f0d77a;--tx:#f3ecd8;--mut:#a89c7c;--ok:#7fc98b;--bad:#e5837a;--rev:#e8c25a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 'Plus Jakarta Sans',system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:22px;font-weight:800;color:var(--gold)}
h1 small{display:block;font-size:12px;font-weight:400;color:var(--mut)}
nav{display:flex;gap:6px;padding:0 24px;border-bottom:1px solid var(--line)}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mut);padding:12px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
nav button.on{color:var(--gold);border-color:var(--gold)}
main{padding:24px}
button,select,input,textarea{font-family:inherit;font-size:13px}
.btn{background:var(--gold);color:#1a1405;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--gold);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:12px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel)}
.kpi b{display:block;font-size:26px;color:var(--gold2);font-weight:800}
.kpi span{color:var(--mut);font-size:12px}
h2{font-size:16px;margin:24px 0 10px;color:var(--gold)}
.bar{display:grid;grid-template-columns:130px 1fr 30px;gap:10px;align-items:center;margin:6px 0}
.bar i{display:block;height:10px;background:var(--gold);border-radius:3px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
.kan{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px}
.col h3{margin:0 0 8px;font-size:13px;color:var(--gold);display:flex;justify-content:space-between}
.card{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px}
.card b{display:block}
.card small{color:var(--mut)}
.card select{width:100%;margin-top:8px;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:4px}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid}
.berhasil{color:var(--ok)}.gagal{color:var(--bad)}.revisi{color:var(--rev)}
.log{border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:8px;background:var(--panel);padding:14px;margin-bottom:12px}
.log.gagal{border-left-color:var(--bad)}.log.berhasil{border-left-color:var(--ok)}
.log h4{margin:0 0 6px;font-size:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.log p{margin:6px 0;white-space:pre-wrap}
.log p em{display:block;font-style:normal;color:var(--mut);font-size:12px}
.hist{color:var(--mut);margin:0 0 14px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--mut)}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:22px}
.spark i{width:6px;background:var(--gold);border-radius:1px}
dialog{background:var(--panel);color:var(--tx);border:1px solid var(--gold);border-radius:10px;width:min(560px,94vw);padding:20px;max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.7)}
label{display:block;margin:10px 0 3px;color:var(--mut);font-size:12px}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:8px}
textarea{min-height:80px;resize:vertical}
select{appearance:auto}
</style>
</head>
<body>
<header>
  <h1>Hypospot R&amp;D Pipeline<small>Riwayat, percobaan, dan status tiap produk</small></h1>
  <div class="row">
    <button class="btn ghost sm" id="st" title="Klik untuk sinkron sekarang (otomatis tiap 10 menit)">Mode lokal</button>
    <button class="btn ghost sm" id="cfgb">Sinkronisasi Sheets</button>
    <button class="btn ghost sm" id="csv">Export CSV</button>
    <button class="btn ghost sm" id="bak">Backup JSON</button>
    <button class="btn ghost sm" id="imp">Import JSON</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
</header>
<nav id="tabs">
  <button data-t="dash" class="on">Dashboard</button>
  <button data-t="pipe">Pipeline</button>
  <button data-t="log">Log percobaan</button>
</nav>
<main id="app"></main>
<dialog id="dlg"><form method="dialog" id="frm"></form></dialog>

<script>
const STAGES=['Ide','Riset formula','Prototype','Uji internal','Uji eksternal','Revisi','Produksi kecil','Launch','Ditunda/Batal'];
const TYPES=['Riset formula','Prototype','Uji internal','Uji eksternal','Revisi','Lainnya'];
const KEY='hypospot_rnd_v1';
let S={products:[],logs:[]},tab='dash',flt='';
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const $=s=>document.querySelector(s);
const CK='hypospot_rnd_cfg';
let cfg={},canPush=false,pt=null;
try{cfg=JSON.parse(localStorage.getItem(CK)||'{}')}catch(e){}
const st=(t,c)=>{const e=$('#st');e.textContent=t;e.style.color=c||''};
const local=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const DK='hypospot_rnd_dirty';
const dirty=v=>{try{v?localStorage.setItem(DK,'1'):localStorage.removeItem(DK)}catch(e){}};
const isDirty=()=>{try{return !!localStorage.getItem(DK)}catch(e){return false}};
const msg=e=>e instanceof SyntaxError?'Google membalas halaman error, bukan data':(e.message||'Gagal');
let busy=false;
const save=()=>{local();if(!cfg.url)return;dirty(true);st('Perubahan belum disinkron (otomatis tiap 10 menit)','var(--rev)')};
async function push(){
  try{const r=await fetch(cfg.url,{method:'POST',body:JSON.stringify({action:'save',token:cfg.token,data:S})});const j=await r.json();if(!j.ok)throw new Error(j.error);
  dirty(false);st('Tersinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),'var(--ok)')}
  catch(e){st(msg(e)+', tersimpan lokal','var(--bad)')}
}
async function pull(){
  if(!cfg.url){st('Mode lokal');return}
  if(busy)return;busy=true;
  st('Menyinkronkan...');
  try{const r=await fetch(cfg.url+'?action=load&token='+encodeURIComponent(cfg.token||''));const j=await r.json();if(!j.ok)throw new Error(j.error);
  const d=j.data;
  if(isDirty()||(!d.products.length&&!d.logs.length&&(S.products.length||S.logs.length))){canPush=true;await push()}
  else{S=d;local();canPush=true;st('Tersinkron '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),'var(--ok)');render()}}
  catch(e){canPush=false;st(msg(e)+' (mode lokal)','var(--bad)')}
  finally{busy=false}
}
function openCfg(){
  form('Sinkronisasi Google Sheets',[
    {k:'url',l:'URL Web App (dari Apps Script)',p:'https://script.google.com/macros/s/.../exec'},
    {k:'token',l:'Kode akses',t:'password',p:'Sama dengan TOKEN di skrip'}
  ],cfg,d=>{cfg={url:d.url.trim(),token:d.token.trim()};try{localStorage.setItem(CK,JSON.stringify(cfg))}catch(e){}canPush=false;setTimeout(pull,0)});
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const rp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
const fd=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'-';
const prod=id=>S.products.find(p=>p.id==id);
const days=d=>Math.max(0,Math.floor((Date.now()-new Date(d))/864e5));

function form(title,fields,vals,onSave){
  const f=$('#frm');
  f.innerHTML=`<h2 style="margin-top:0">${esc(title)}</h2>`+fields.map(x=>{
    const v=vals[x.k]??'';
    let i;
    if(x.t=='textarea')i=`<textarea name="${x.k}" ${x.r?'required':''} placeholder="${esc(x.p||'')}">${esc(v)}</textarea>`;
    else if(x.t=='select')i=`<select name="${x.k}">${x.o.map(o=>{const ov=o.v??o,ol=o.l??o;return `<option value="${esc(ov)}" ${ov==v?'selected':''}>${esc(ol)}</option>`}).join('')}</select>`;
    else i=`<input name="${x.k}" type="${x.t||'text'}" value="${esc(v)}" ${x.r?'required':''} ${x.t=='number'?'min="0" step="any"':''} placeholder="${esc(x.p||'')}">`;
    return `<label>${x.l}</label>${i}`;
  }).join('')+`<div class="row" style="margin-top:16px;justify-content:flex-end"><button type="button" class="btn ghost" id="cx">Batal</button><button class="btn" value="ok">Simpan</button></div>`;
  $('#cx').onclick=()=>$('#dlg').close();
  f.onsubmit=e=>{e.preventDefault();onSave(Object.fromEntries(new FormData(f)));save();$('#dlg').close();render()};
  $('#dlg').showModal();
}

function addProduct(p={}){
  form(p.id?'Ubah produk':'Produk baru',[
    {k:'name',l:'Nama produk',r:1,p:'mis. Sole cleaner foam'},
    {k:'stage',l:'Tahap saat ini',t:'select',o:STAGES},
    {k:'goal',l:'Tujuan / target produk',t:'textarea',p:'Masalah apa yang mau dipecahkan, target hasil, target HPP'}
  ],{stage:'Ide',...p},d=>{
    if(p.id){const x=prod(p.id);if(x.stage!=d.stage){x.hist.push({stage:d.stage,date:today()});x.sd=today()}Object.assign(x,d)}
    else S.products.push({id:uid(),...d,sd:today(),created:today(),hist:[{stage:d.stage,date:today()}]});
  });
}
function move(id,st){const p=prod(id);if(p.stage==st)return;p.stage=st;p.sd=today();p.hist.push({stage:st,date:today()});save();render()}
function delProduct(id){if(confirm('Hapus produk ini beserta seluruh log percobaannya?')){S.products=S.products.filter(p=>p.id!=id);S.logs=S.logs.filter(l=>l.pid!=id);save();render()}}

function addLog(l={}){
  if(!S.products.length){alert('Tambahkan produk dulu di tab Pipeline.');return}
  const pid=l.pid||flt||S.products[0].id;
  const nextVer='v'+(S.logs.filter(x=>x.pid==pid).length+1);
  form(l.id?'Ubah percobaan':'Percobaan baru',[
    {k:'pid',l:'Produk',t:'select',o:S.products.map(p=>({v:p.id,l:p.name}))},
    {k:'date',l:'Tanggal',t:'date',r:1},
    {k:'ver',l:'Versi / kode percobaan',r:1,p:'mis. v3, F-12, atau v3b'},
    {k:'type',l:'Jenis',t:'select',o:TYPES},
    {k:'goal',l:'Tujuan / hipotesis',t:'textarea',p:'Apa yang mau dibuktikan di percobaan ini?'},
    {k:'what',l:'Bahan, komposisi, dan takaran',t:'textarea',p:'Tulis selengkap mungkin: bahan, persentase, supplier, metode'},
    {k:'result',l:'Hasil',t:'select',o:['berhasil','gagal','revisi']},
    {k:'why',l:'Detail hasil dan alasan',t:'textarea',p:'Apa yang terjadi? Kenapa gagal atau berhasil?'},
    {k:'score',l:'Skor (0-10, opsional)',t:'number'},
    {k:'cost',l:'Biaya percobaan (Rp)',t:'number'},
    {k:'next',l:'Keputusan berikutnya',t:'textarea',p:'Lanjut, ubah apa, atau berhenti'}
  ],{date:today(),type:'Riset formula',result:'revisi',ver:nextVer,...l,pid},d=>{
    if(d.score==='')delete d.score;
    if(l.id)Object.assign(S.logs.find(x=>x.id==l.id),d);else S.logs.push({id:uid(),...d});
    flt=d.pid;
  });
}
function delLog(id){if(confirm('Hapus percobaan ini?')){S.logs=S.logs.filter(l=>l.id!=id);save();render()}}

function dash(){
  const L=S.logs,P=S.products,done=L.filter(l=>l.result!='revisi');
  const ok=L.filter(l=>l.result=='berhasil').length;
  const act=P.filter(p=>!['Launch','Ditunda/Batal'].includes(p.stage)).length;
  const max=Math.max(1,...STAGES.map(s=>P.filter(p=>p.stage==s).length));
  return `<div class="kpis">
  <div class="kpi"><b>${P.length}</b><span>Total produk</span></div>
  <div class="kpi"><b>${act}</b><span>Masih berjalan</span></div>
  <div class="kpi"><b>${P.filter(p=>p.stage=='Launch').length}</b><span>Sudah launch</span></div>
  <div class="kpi"><b>${L.length}</b><span>Total percobaan</span></div>
  <div class="kpi"><b>${done.length?Math.round(ok/done.length*100)+'%':'-'}</b><span>Rasio berhasil</span></div>
  <div class="kpi"><b>${rp(L.reduce((a,l)=>a+Number(l.cost||0),0))}</b><span>Total biaya R&amp;D</span></div></div>
  <h2>Jumlah produk per tahap</h2>
  ${STAGES.map(s=>{const n=P.filter(p=>p.stage==s).length;return `<div class="bar"><span>${s}</span><span><i style="width:${n/max*100}%"></i></span><b>${n}</b></div>`}).join('')}
  <h2>Status produk</h2>
  ${P.length?`<div class="tw"><table><tr><th>Produk</th><th>Tahap</th><th>Lama di tahap</th><th>Percobaan</th><th>Hasil terakhir</th><th>Tren skor</th><th>Biaya</th></tr>
  ${P.map(p=>{const pl=L.filter(l=>l.pid==p.id).sort((a,b)=>a.date.localeCompare(b.date));const last=pl[pl.length-1];const sc=pl.filter(l=>l.score!=null&&l.score!=='').map(l=>+l.score);
  const stale=days(p.sd)>30&&!['Launch','Ditunda/Batal'].includes(p.stage);
  return `<tr><td><b>${esc(p.name)}</b></td><td>${p.stage}</td><td>${days(p.sd)} hari${stale?' <span class="revisi">(mandek?)</span>':''}</td><td>${pl.length}</td>
  <td>${last?`<span class="badge ${last.result}">${last.result}</span> ${esc(last.ver)}`:'-'}</td>
  <td>${sc.length?`<span class="spark">${sc.slice(-10).map(s=>`<i style="height:${Math.max(3,s*2.2)}px" title="${s}"></i>`).join('')}</span>`:'-'}</td>
  <td>${rp(pl.reduce((a,l)=>a+Number(l.cost||0),0))}</td></tr>`}).join('')}</table></div>`:'<div class="empty">Belum ada data. Mulai dari tab Pipeline dengan menambah produk pertama.</div>'}`;
}

function pipe(){
  return `<div class="row" style="margin-bottom:14px"><button class="btn" id="np">Tambah produk</button></div>
  <div class="kan">${STAGES.map(s=>{const ps=S.products.filter(p=>p.stage==s);
  return `<div class="col"><h3>${s}<span>${ps.length}</span></h3>${ps.map(p=>`<div class="card"><b>${esc(p.name)}</b><small>${days(p.sd)} hari di tahap ini · ${S.logs.filter(l=>l.pid==p.id).length} percobaan</small>
  <select data-mv="${p.id}" aria-label="Pindah tahap">${STAGES.map(x=>`<option ${x==p.stage?'selected':''}>${x}</option>`).join('')}</select>
  <div class="row" style="margin-top:8px"><button class="btn ghost sm" data-lg="${p.id}">Log</button><button class="btn ghost sm" data-ed="${p.id}">Ubah</button><button class="btn ghost sm" data-dl="${p.id}">Hapus</button></div></div>`).join('')||'<small style="color:var(--mut)">Kosong</small>'}</div>`}).join('')}</div>`;
}

function logTab(){
  const ls=S.logs.filter(l=>!flt||l.pid==flt).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
  const p=flt&&prod(flt);
  return `<div class="row" style="margin-bottom:14px">
  <select id="fp" style="width:auto;min-width:200px" aria-label="Filter produk"><option value="">Semua produk</option>${S.products.map(x=>`<option value="${x.id}" ${x.id==flt?'selected':''}>${esc(x.name)}</option>`).join('')}</select>
  <button class="btn" id="nl">Tambah percobaan</button></div>
  ${p?`<p class="hist"><b>Riwayat tahap:</b> ${p.hist.map(h=>`${h.stage} (${fd(h.date)})`).join(' → ')}${p.goal?`<br><b>Tujuan:</b> ${esc(p.goal)}`:''}</p>`:''}
  ${ls.length?ls.map(l=>{const pr=prod(l.pid);return `<div class="log ${l.result}"><h4>${esc(l.ver)} ${!flt&&pr?`· ${esc(pr.name)}`:''}<span class="badge ${l.result}">${l.result}</span><small style="color:var(--mut);font-weight:400">${esc(l.type)} · ${fd(l.date)}${l.score!=null&&l.score!==''?` · skor ${l.score}/10`:''}${l.cost?` · ${rp(l.cost)}`:''}</small></h4>
  ${l.goal?`<p><em>Tujuan</em>${esc(l.goal)}</p>`:''}${l.what?`<p><em>Bahan dan takaran</em>${esc(l.what)}</p>`:''}${l.why?`<p><em>Hasil</em>${esc(l.why)}</p>`:''}${l.next?`<p><em>Berikutnya</em>${esc(l.next)}</p>`:''}
  <div class="row"><button class="btn ghost sm" data-el="${l.id}">Ubah</button><button class="btn ghost sm" data-dx="${l.id}">Hapus</button></div></div>`}).join(''):'<div class="empty">Belum ada percobaan. Catat percobaan pertama, termasuk yang gagal.</div>'}`;
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
  $('#app').innerHTML=tab=='dash'?dash():tab=='pipe'?pipe():logTab();
  const q=(s,f)=>document.querySelectorAll(s).forEach(f);
  if($('#np'))$('#np').onclick=()=>addProduct();
  if($('#nl'))$('#nl').onclick=()=>addLog();
  if($('#fp'))$('#fp').onchange=e=>{flt=e.target.value;render()};
  q('[data-mv]',e=>e.onchange=()=>move(e.dataset.mv,e.value));
  q('[data-lg]',e=>e.onclick=()=>{flt=e.dataset.lg;tab='log';render()});
  q('[data-ed]',e=>e.onclick=()=>addProduct(prod(e.dataset.ed)));
  q('[data-dl]',e=>e.onclick=()=>delProduct(e.dataset.dl));
  q('[data-el]',e=>e.onclick=()=>addLog(S.logs.find(l=>l.id==e.dataset.el)));
  q('[data-dx]',e=>e.onclick=()=>delLog(e.dataset.dx));
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});

function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
$('#bak').onclick=()=>dl('hypospot-rnd-backup.json',JSON.stringify(S,null,1),'application/json');
$('#csv').onclick=()=>{
  const h=['Produk','Tahap produk','Tanggal','Versi','Jenis','Tujuan','Bahan dan takaran','Hasil','Detail hasil','Skor','Biaya','Keputusan berikutnya'];
  const c=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=S.logs.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(l=>{const p=prod(l.pid)||{};return [p.name,p.stage,l.date,l.ver,l.type,l.goal,l.what,l.result,l.why,l.score,l.cost,l.next].map(c).join(',')});
  dl('hypospot-rnd-log.csv','\ufeff'+[h.map(c).join(','),...rows].join('\n'),'text/csv');
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.logs)throw 0;S=d;save();render()}catch(x){alert('File tidak valid. Gunakan file hasil Backup JSON dari aplikasi ini.')}};r.readAsText(f);e.target.value=''};
$('#cfgb').onclick=openCfg;
$('#st').onclick=pull;
setInterval(()=>{if(cfg.url&&!$('#dlg').open)pull()},10*60*1000);
render();
pull();
</script>
</body>
</html>
